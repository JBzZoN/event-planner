<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="row w-100 justify-content-center">
    <div class="col-12 col-md-10 col-lg-8 col-xl-7">
      <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5">
        <div class="card-body text-center" *ngIf="!vendorSelected && !userSelected">
          
          <!-- Header Section -->
          <h1 class="display-4 fw-bold mb-2" style="color: var(--text-color)">
            Welcome to Our Platform
          </h1>
          <p class="lead mb-5" style="color: #6c7a9a">
            Please select your role to get started
          </p>

          <!-- Button Row -->
          <div class="row g-4 mb-4">
            <!-- Vendor Button - Left -->
            <div class="col-12 col-md-6">
              <button 
                class="btn w-100 h-100 py-5 px-4 border-2 rounded-4 d-flex flex-column align-items-center justify-content-center gap-3 role-btn vendor-btn"
                (click)="selectVendor()"
                (mouseenter)="isVendorHovered = true"
                (mouseleave)="isVendorHovered = false"
                [class.vendor-hover]="isVendorHovered">
                
                <div class="icon-wrapper rounded-circle d-flex align-items-center justify-content-center mb-2"
                  [class.vendor-icon-hover]="isVendorHovered">
                  <i class="bi bi-shop fs-1"><img src="../../../assets/vendor.png" style="width: 60%;"/></i>
                </div>

                <h3 class="fw-bold mb-1" style="color: var(--text-color)">Vendor</h3>
                <p class="mb-0 small" style="color: #6b7a9a; line-height: 1.6;">
                  I want to sell products<br>and manage my store
                </p>
                
                <div class="mt-3 arrow-wrapper" [class.arrow-visible]="isVendorHovered">
                  <i class="bi bi-arrow-right fs-4" style="color: var(--pink-color)"></i>
                </div>
              </button>
            </div>

            <!-- User Button - Right -->
            <div class="col-12 col-md-6">
              <button 
                class="btn w-100 h-100 py-5 px-4 border-2 rounded-4 d-flex flex-column align-items-center justify-content-center gap-3 role-btn user-btn"
                (click)="selectUser()"
                (mouseenter)="isUserHovered = true"
                (mouseleave)="isUserHovered = false"
                [class.user-hover]="isUserHovered">
                
                <div class="icon-wrapper rounded-circle d-flex align-items-center justify-content-center mb-2"
                  [class.user-icon-hover]="isUserHovered">
                  <i class="bi bi-person fs-1"><img src="../../../assets/user.png" style="width: 40%;"/></i>
                </div>

                <h3 class="fw-bold mb-1" style="color: var(--text-color)">User</h3>
                <p class="mb-0 small" style="color: #6b7a9a; line-height: 1.6;">
                  I want to browse and<br>purchase products
                </p>
                
                <div class="mt-3 arrow-wrapper" [class.arrow-visible]="isUserHovered">
                  <i class="bi bi-arrow-right fs-4" style="color: var(--text-color)"></i>
                </div>
              </button>
            </div>
          </div>
        </div>
        <div class="card-body text-center" *ngIf="vendorSelected" style="width: 100%;">

            <div class="text-center mb-4">
                <h4 class="fw-bold mb-1">Vendor Registration</h4>
                <p class="text-muted mb-0">
                Enter your organisation and personal details
                </p>
            </div>

            <form>

                <!-- Organisation Details -->
                <div class="text-start mb-3">
                <h6 class="fw-bold" style="color: var(--text-color);">
                    Organisation Details
                </h6>
                <hr>
                </div>

                <div class="row g-3">

                <!-- Organisation Name -->
                <div class="col-md-6">
                    <div class="form-floating">
                    <input
                        type="text"
                        class="form-control"
                        id="organisationName"
                        name="organisationName"
                        placeholder="Organisation Name">

                    <label for="organisationName">
                        Organisation Name
                    </label>
                    </div>
                </div>

                <!-- Phone -->
                <div class="col-md-6">
                    <div class="form-floating">
                    <input
                        type="tel"
                        class="form-control"
                        id="phone"
                        name="phone"
                        placeholder="Phone Number">

                    <label for="phone">
                        Phone Number
                    </label>
                    </div>
                </div>

                <!-- Office Address -->
                <div class="col-12">
                    <div class="form-floating">
                    <textarea
                        class="form-control"
                        id="officeAddress"
                        name="officeAddress"
                        placeholder="Office Address"
                        style="height: 100px"></textarea>

                    <label for="officeAddress">
                        Office Address
                    </label>
                    </div>
                </div>

                </div>


                <!-- Personal Details -->
                <div class="text-start mt-4 mb-3">
                <h6 class="fw-bold" style="color: var(--text-color);">
                    Personal Details
                </h6>
                <hr>
                </div>

                <div class="row g-3">

                <!-- Name -->
                <div class="col-12">
                    <div class="form-floating">
                    <input
                        type="text"
                        class="form-control"
                        id="name"
                        name="name"
                        placeholder="Full Name">

                    <label for="name">
                        Full Name
                    </label>
                    </div>
                </div>

                <!-- Personal Address -->
                <div class="col-12">
                    <div class="form-floating">
                    <textarea
                        class="form-control"
                        id="personalAddress"
                        name="personalAddress"
                        placeholder="Personal Address"
                        style="height: 100px"></textarea>

                    <label for="personalAddress">
                        Personal Address
                    </label>
                    </div>
                </div>

                </div>


                <!-- Buttons -->
                <div class="d-flex justify-content-end gap-2 mt-4">

                <button
                    type="button"
                    class="btn btn-outline-secondary px-4"
                    (click)="cancel()">
                    Cancel
                </button>

                <button
                    type="submit"
                    class="btn px-4"
                    style="
                    background-color: var(--pink-color);
                    border-color: var(--pink-color);
                    color: white;
                    ">
                    Continue
                </button>

                </div>

            </form>
        </div>
        <div class="card-body text-center" *ngIf="userSelected" style="width: 100%;">

            <div class="text-center mb-4">
                <h4 class="fw-bold mb-1">User Registration</h4>
                <p class="text-muted mb-0">
                Enter your personal details to get started
                </p>
            </div>

            <form>

                <!-- Personal Details -->
                <div class="text-start mb-3">
                <h6 class="fw-bold" style="color: var(--text-color);">
                    Personal Details
                </h6>
                <hr>
                </div>

                <div class="row g-3">

                <!-- Name -->
                <div class="col-12">
                    <div class="form-floating">
                    <input
                        type="text"
                        class="form-control"
                        id="userName"
                        name="userName"
                        placeholder="Full Name">

                    <label for="userName">
                        Full Name
                    </label>
                    </div>
                </div>

                <!-- Personal Address -->
                <div class="col-12">
                    <div class="form-floating">
                    <textarea
                        class="form-control"
                        id="personalAddress"
                        name="personalAddress"
                        placeholder="Personal Address"
                        style="height: 120px"></textarea>

                    <label for="personalAddress">
                        Personal Address
                    </label>
                    </div>
                </div>

                </div>

                <!-- Buttons -->
                <div class="d-flex justify-content-end gap-2 mt-4">

                <button
                    type="button"
                    class="btn btn-outline-secondary px-4"
                    (click)="cancel()">
                    Cancel
                </button>

                <button
                    type="submit"
                    class="btn btn-user px-4">
                    Continue
                </button>

                </div>

            </form>
        </div>
      </div>
    </div>
  </div>
</div>
